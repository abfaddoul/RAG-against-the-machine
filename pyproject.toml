[project]
name = "rag-against-machine"
version = "0.1.0"
description = "A retrieval-augmented generation system for answering questions about codebases."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fire>=0.7.1",
    "joblib>=1.6.0",
    "langchain>=1.4.2",
    "langchain-text-splitters>=1.1.2",
    "pydantic>=2.13.5",
    "rank-bm25>=0.2.2",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]

[tool.mypy]
sqlite_cache = false
